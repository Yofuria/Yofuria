name: Update profile metrics

on:
  workflow_dispatch:
  schedule:
    - cron: '47 10 * * *'
  push:
    branches: [main]
    paths:
      - 'metrics/config.json'
      - '.github/scripts/update_metrics.py'
      - '.github/workflows/profile-metrics.yml'

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check citation comparison and links
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Collect and render metrics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/update_metrics.py
      - name: Commit changed metrics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md metrics/stats.json metrics/README.md metrics/*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Update profile metrics'
          git push origin HEAD:main
